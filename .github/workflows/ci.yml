name: Repo Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"

      - name: Run Node tests
        run: node --test scripts/*.test.mjs

      - name: Validate Bash installer
        shell: bash
        run: bash -n install.sh

      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) {
            $parseErrors | ForEach-Object Message
            exit 1
          }
